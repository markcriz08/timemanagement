<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Records - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .action-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-table-action {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-table-edit {
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .btn-table-edit:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-table-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }
        .btn-table-delete:hover {
            background: rgba(239, 68, 68, 0.35);
            color: #ffffff;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="bg-glow-container">
        <div class="glow-orb orb-primary"></div>
        <div class="glow-orb orb-cyan"></div>
    </div>

    <nav class="app-nav">
        <div class="nav-brand">
            <div class="nav-brand-logo"><i class="ri-shield-user-line"></i></div>
            <span>ADMIN PORTAL</span>
        </div>
        <div class="nav-links">
            <a href="/admin" class="nav-link"><i class="ri-user-add-line"></i> Employee Setup</a>
            <a href="/record" class="nav-link active"><i class="ri-file-list-3-line"></i> Attendance Records</a>
            <a href="/kiosk" target="_blank" class="nav-link"><i class="ri-computer-line"></i> Open Kiosk</a>
            <a href="/logout" class="nav-link btn-logout"><i class="ri-logout-box-r-line"></i> Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="kpi-grid">
            <div class="glass-panel kpi-card">
                <div class="kpi-icon indigo"><i class="ri-history-line"></i></div>
                <div class="kpi-data">
                    <h4>Total Daily Logs</h4>
                    <span id="kpi-total">0</span>
                </div>
            </div>
            <div class="glass-panel kpi-card">
                <div class="kpi-icon emerald"><i class="ri-login-box-line"></i></div>
                <div class="kpi-data">
                    <h4>Punches In</h4>
                    <span id="kpi-in">0</span>
                </div>
            </div>
            <div class="glass-panel kpi-card">
                <div class="kpi-icon amber"><i class="ri-restaurant-line"></i></div>
                <div class="kpi-data">
                    <h4>Lunch Logs</h4>
                    <span id="kpi-lunch">0</span>
                </div>
            </div>
            <div class="glass-panel kpi-card">
                <div class="kpi-icon rose"><i class="ri-logout-box-r-line"></i></div>
                <div class="kpi-data">
                    <h4>Punches Out</h4>
                    <span id="kpi-out">0</span>
                </div>
            </div>
        </div>

        <div class="glass-panel" style="padding: 1.75rem;">
            <div class="section-header">
                <h2 style="font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                    <i class="ri-time-line" style="color: var(--accent-cyan);"></i> Attendance Master Logs
                </h2>
                <div style="display: flex; gap: 0.75rem;">
                    <button onclick="loadRecords()" class="btn-action btn-secondary">
                        <i class="ri-refresh-line"></i> Refresh
                    </button>
                    <button onclick="exportToExcel()" class="btn-action btn-success">
                        <i class="ri-file-excel-line"></i> Export Excel
                    </button>
                </div>
            </div>

            <div style="margin-bottom: 1.25rem;">
                <input type="text" id="search-input" onkeyup="filterLogs()" class="input-control" placeholder="Search logs by Employee ID or Name...">
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Time In</th>
                            <th>Lunch Out</th>
                            <th>Lunch In</th>
                            <th>Time Out</th>
                            <th>Method</th>
                            <th style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Modal Dialog -->
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 style="font-size: 1.1rem; color: #fff; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px;">
                <i class="ri-edit-line" style="color: var(--accent-cyan);"></i> Edit Attendance Punch Times
            </h3>
            <form id="edit-form" onsubmit="saveEdit(event)">
                <input type="hidden" id="edit-emp-code">
                <input type="hidden" id="edit-date">

                <div class="form-group" style="margin-bottom: 0.75rem;">
                    <label style="color: var(--text-muted); font-size: 0.8rem;">Employee Name</label>
                    <input type="text" id="edit-name" class="input-control" readonly style="opacity: 0.7;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem;">
                    <div class="form-group">
                        <label style="color: var(--text-muted); font-size: 0.8rem;">Time In (HH:MM:SS)</label>
                        <input type="text" id="edit-time-in" class="input-control" placeholder="08:00:00">
                    </div>
                    <div class="form-group">
                        <label style="color: var(--text-muted); font-size: 0.8rem;">Lunch Out (HH:MM:SS)</label>
                        <input type="text" id="edit-lunch-out" class="input-control" placeholder="12:00:00">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem;">
                    <div class="form-group">
                        <label style="color: var(--text-muted); font-size: 0.8rem;">Lunch In (HH:MM:SS)</label>
                        <input type="text" id="edit-lunch-in" class="input-control" placeholder="13:00:00">
                    </div>
                    <div class="form-group">
                        <label style="color: var(--text-muted); font-size: 0.8rem;">Time Out (HH:MM:SS)</label>
                        <input type="text" id="edit-time-out" class="input-control" placeholder="17:00:00">
                    </div>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn-action btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-action btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/sound.js') }}"></script>
    <script src="{{ url_for('static', filename='js/record.js') }}?v=1.0.3"></script>
</body>
</html>

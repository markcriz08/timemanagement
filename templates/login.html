<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Replace existing viewport tag on line 5 with: -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Attendance Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">

    <div class="bg-glow-container">
        <div class="glow-orb orb-primary"></div>
        <div class="glow-orb orb-cyan"></div>
    </div>

    <div class="glass-panel" style="width: 100%; max-width: 420px; padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="nav-brand-logo" style="margin: 0 auto 1rem auto; width: 52px; height: 52px; font-size: 1.6rem;">
                <i class="ri-shield-keyhole-line"></i>
            </div>
            <h2 style="font-size: 1.5rem; font-weight: 700;">Admin Portal</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">Sign in to access control panel</p>
        </div>

        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.85rem; display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem;">
            <i class="ri-error-warning-fill"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="input-control" placeholder="admin" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="input-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-action btn-primary" style="width: 100%; margin-top: 0.5rem;" onclick="sounds.playClick()">
                <i class="ri-login-box-line"></i> Sign In
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--card-border); padding-top: 1rem;">
            <a href="/kiosk" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px;">
                <i class="ri-computer-line"></i> Launch Kiosk Mode
            </a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/sound.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Setup - Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="bg-glow-container">
        <div class="glow-orb orb-primary"></div>
        <div class="glow-orb orb-cyan"></div>
    </div>

    <!-- Navigation Header -->
    <nav class="app-nav">
        <div class="nav-brand">
            <div class="nav-brand-logo"><i class="ri-shield-user-line"></i></div>
            <span>ADMIN PORTAL</span>
        </div>
        <div class="nav-links">
            <a href="/admin" class="nav-link active"><i class="ri-user-add-line"></i> Employee Setup</a>
            <a href="/record" class="nav-link"><i class="ri-file-list-3-line"></i> Attendance Records</a>
            <a href="/kiosk" target="_blank" class="nav-link"><i class="ri-computer-line"></i> Open Kiosk</a>
            <a href="/logout" class="nav-link btn-logout"><i class="ri-logout-box-r-line"></i> Logout</a>
        </div>
    </nav>

    <div class="container" style="display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; align-items: start;">
        
        <!-- Registration & Face Capture Form -->
        <div class="glass-panel" style="padding: 1.5rem;">
            <h2 id="form-title" style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px;">
                <i class="ri-user-add-line" style="color: var(--accent-cyan);"></i> Register New Employee
            </h2>

            <!-- Face Registration Camera Preview -->
            <div style="position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4/3; margin-bottom: 0.75rem; border: 1px solid var(--card-border);">
                <video id="admin-webcam" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
            </div>
            
            <div id="admin-status" style="font-size: 0.8rem; padding: 0.5rem 0.75rem; border-radius: 6px; background: rgba(15, 23, 42, 0.6); color: #94a3b8; margin-bottom: 1.25rem; text-align: center;">
                Initializing camera feed...
            </div>

            <form id="employee-form" onsubmit="event.preventDefault(); saveEmployee();">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label for="reg-code">Employee ID</label>
                        <input type="text" id="reg-code" class="input-control" placeholder="EMP-101" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="reg-pin">4-Digit PIN</label>
                        <input type="password" id="reg-pin" class="input-control" maxlength="4" placeholder="••••" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="input-control" placeholder="John Doe" required autocomplete="off">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label for="reg-age">Age</label>
                        <input type="number" id="reg-age" class="input-control" placeholder="28" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-gender">Gender</label>
                        <select id="reg-gender" class="input-control" required style="background: var(--bg-dark);">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-birthday">Birthday</label>
                    <input type="date" id="reg-birthday" class="input-control" required style="background: var(--bg-dark);">
                </div>

                <div class="form-group">
                    <label for="reg-address">Address</label>
                    <input type="text" id="reg-address" class="input-control" placeholder="City, Country" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="reg-contact">Contact No.</label>
                    <input type="text" id="reg-contact" class="input-control" placeholder="+1 234 567 890" autocomplete="off">
                </div>

                <div style="display: flex; gap: 0.75rem; margin-top: 1.25rem;">
                    <button type="button" onclick="resetForm()" class="btn-action btn-secondary" style="flex: 1;">Cancel</button>
                    <button type="submit" id="btn-save" class="btn-action btn-primary" style="flex: 2;">
                        <i class="ri-save-line"></i> Save & Register
                    </button>
                </div>
            </form>
        </div>

        <!-- Registered Employees Table -->
        <div class="glass-panel" style="padding: 1.5rem;">
            <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px;">
                <i class="ri-team-line" style="color: var(--accent-cyan);"></i> Registered Employee Directory
            </h2>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Birthday</th>
                            <th>Address</th>
                            <th>Contact</th>
                            <th>QR</th>
                            <th style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employees-list">
                        <!-- Populated dynamically via admin.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- View Employee Details Modal -->
    <div id="view-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 9999;">
        <div class="glass-panel" style="width: 100%; max-width: 400px; padding: 2rem; border-radius: 16px; text-align: center;">
            <h3 id="modal-emp-name" style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.25rem;">--</h3>
            <div id="modal-emp-code" style="color: var(--accent-cyan); font-weight: 600; font-size: 0.9rem; margin-bottom: 1.25rem;">--</div>
            
            <div id="modal-qrcode" style="display: inline-block; padding: 12px; background: #fff; border-radius: 12px; margin-bottom: 1.25rem;"></div>

            <div id="modal-details" style="text-align: left; background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 8px; font-size: 0.85rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 1.5rem;">
            </div>

            <button type="button" onclick="closeViewModal()" class="btn-action btn-secondary" style="width: 100%;">Close</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/sound.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
